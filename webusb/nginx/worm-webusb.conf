server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN;
    return 301 https://$host$request_uri;
}

# Optional coarse UX-only desktop user-agent block for the root route.
# Keep this disabled unless you have a separate static desktop-block page to serve.
# Nginx HTTP Basic Authentication below is the server-side access boundary for
# every static asset, manifest, release ZIP, and WebUSB installer route.
# Do not apply user-agent blocking to /releases/, /assets/, or /manifest.json;
# Android clients must keep downloading release ZIPs with HTTP Range / resume
# support intact after authentication succeeds.
#
# map $http_user_agent $worm_desktop_ua {
#     default 0;
#     ~*(Windows|Macintosh|Mac\ OS\ X|X11|CrOS) 1;
#     ~*Android 0;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR-DOMAIN;

    root /var/www/worm-webusb;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/YOUR-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN/privkey.pem;

    server_tokens off;
    autoindex off;

    auth_basic "Worm OS Installer";
    auth_basic_user_file /etc/nginx/.worm-webusb.htpasswd;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "usb=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /releases/ {
        gzip off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "usb=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; worker-src 'self' blob:; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges "bytes" always;
        types {
            application/zip zip;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location / {
        # Optional UX-only root guard. This is intentionally commented out and
        # must not be treated as a security boundary; browser UA strings are not
        # reliable, especially with Android Desktop site mode.
        #
        # if ($uri = /) {
        #     set $worm_root_request 1;
        # }
        # if ($worm_desktop_ua = 1) {
        #     set $worm_root_request "${worm_root_request}desktop";
        # }
        # if ($worm_root_request = "1desktop") {
        #     rewrite ^ /index.html last;
        # }
        try_files $uri $uri/ /index.html;
    }
}
