server {
    listen 10.90.20.10:443 ssl;
    server_name worm.coffee.pm;

    root /var/www/worm-private;
    index index.html;

    server_tokens off;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/coffee.pm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.pm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    allow 10.90.0.0/16;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /style.css {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /app.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /public-data/ {
        add_header Cache-Control "no-cache" always;
        types {
            application/json json;
        }
        try_files $uri =404;
    }

    location /release/ {
        try_files /index.html =404;
    }

    location /ota/ {
        try_files /index.html =404;
    }

    location /timeline {
        try_files /index.html =404;
    }

    location /timeline/ {
        try_files /index.html =404;
    }

    location /files/ {
        gzip off;
        types {
            application/zip zip;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "private, no-transform" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 162.55.6.173:443 ssl;
    listen [2a01:4f8:252:7ee::2]:443 ssl;
    server_name worm.coffee.pm;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/coffee.pm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.pm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 302 https://worm.estixari.com/;
}

server {
    listen 162.55.6.173:80;
    listen [2a01:4f8:252:7ee::2]:80;
    server_name worm.coffee.pm;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 302 https://worm.estixari.com/;
    }
}
