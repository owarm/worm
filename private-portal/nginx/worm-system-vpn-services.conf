server {
    listen 10.90.20.10:443 ssl;
    server_name apps.coffee.pm;

    root /var/www/worm-apps;
    index index.html;

    server_tokens off;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/coffee.pm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.pm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    allow 10.90.0.0/16;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /metadata/apps.json {
        types { application/json json; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /metadata/ {
        return 404;
    }

    location /files/ {
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream idsig;
            application/gzip gz;
            application/x-brotli br;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "private, no-transform" always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 10.90.20.10:443 ssl;
    server_name releases.coffee.pm;

    root /var/www/worm-releases;
    index index.html;

    server_tokens off;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/coffee.pm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.pm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    allow 10.90.0.0/16;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* (target_files|keys?|source|tmp|temp|partial|unfinished|\.part|\.crdownload|\.pk8|id_rsa|id_ed25519|avb.*key) {
        return 404;
    }

    location ~* "^/(?:[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]+-(?:install|factory|img)-[0-9]{8,}\.zip$" {
        types { application/zip zip; }
        default_type application/zip;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none';" always;
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "private, no-transform" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

