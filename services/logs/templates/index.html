<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worm Logs</title>
  <style>
    :root { color-scheme: dark; --bg:#111310; --panel:#191d18; --line:#30372d; --text:#e6eadf; --muted:#a4ad9b; --accent:#9fc56b; --bad:#d97973; --run:#d2b55f; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
    header, main { width:min(1180px, calc(100% - 32px)); margin:0 auto; }
    header { padding:28px 0 18px; display:flex; justify-content:space-between; gap:16px; align-items:flex-end; }
    h1 { margin:0; font-size:28px; letter-spacing:0; }
    .sub { color:var(--muted); font-size:13px; }
    form { display:grid; grid-template-columns:1fr 150px 150px auto; gap:10px; margin:12px 0 18px; }
    input, select, button { min-height:40px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:6px; padding:0 10px; }
    button { cursor:pointer; color:#10140d; background:var(--accent); border-color:var(--accent); font-weight:700; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    table { width:100%; border-collapse:collapse; min-width:850px; }
    th, td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    a { color:var(--accent); text-decoration:none; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#252b22; color:var(--muted); font-size:12px; }
    .success { color:var(--accent); } .failed { color:var(--bad); } .running { color:var(--run); }
    .empty { color:var(--muted); text-align:center; padding:30px; }
    @media (max-width:720px) { header { display:block; } form { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Worm Logs</h1>
      <div class="sub">Europe/Rome · dynamic SQLite index</div>
    </div>
    <div class="sub">$db_path</div>
  </header>
  <main>
    <form method="get" action="/">
      <input type="search" name="q" value="$q" placeholder="Search title, command, host, cwd">
      <select name="source">$source_options</select>
      <select name="status">$status_options</select>
      <button type="submit">Filter</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Title</th><th>Source</th><th>Status</th><th>Exit</th><th>Size</th><th>Host</th></tr></thead>
        <tbody>$rows</tbody>
      </table>
    </div>
  </main>
</body>
</html>
